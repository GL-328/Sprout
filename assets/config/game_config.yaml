# ---------------------------------------------------------------------------
# Garden visitors
#
# A visitor can appear when ALL of its conditions hold:
#   environments      plots it visits (empty list = any plot)
#   min_mature_plants mature plants in that plot
#   min_streak_days   current gentle streak (days with a quest or a rest day)
#   time_of_day       any, day or night
#   chance            chance per garden visit, once the conditions hold
# Feeding a visitor its favourite fruit gives a small thank-you in coins.
# ---------------------------------------------------------------------------
visitors:
  butterfly: { name: Butterfly, emoji: "🦋", environments: [], min_mature_plants: 1, min_streak_days: 0, time_of_day: day, chance: 0.6, favourite_fruit: lavender_hedge, thanks_coins: 6 }
  bee: { name: Bumblebee, emoji: "🐝", environments: [], min_mature_plants: 2, min_streak_days: 0, time_of_day: day, chance: 0.5, favourite_fruit: giant_sunflower, thanks_coins: 6 }
  songbird: { name: Songbird, emoji: "🐦", environments: [], min_mature_plants: 1, min_streak_days: 3, time_of_day: day, chance: 0.4, favourite_fruit: berry_bush, thanks_coins: 8 }
  ladybird: { name: Ladybird, emoji: "🐞", environments: [meadow, orchard], min_mature_plants: 1, min_streak_days: 0, time_of_day: day, chance: 0.35, favourite_fruit: apple_tree, thanks_coins: 5 }
  hedgehog: { name: Hedgehog, emoji: "🦔", environments: [meadow, forest], min_mature_plants: 2, min_streak_days: 5, time_of_day: night, chance: 0.35, favourite_fruit: apple_tree, thanks_coins: 10 }
  firefly: { name: Fireflies, emoji: "✨", environments: [forest], min_mature_plants: 1, min_streak_days: 0, time_of_day: night, chance: 0.7, favourite_fruit: mushroom_grove, thanks_coins: 6 }
  squirrel: { name: Squirrel, emoji: "🐿️", environments: [forest], min_mature_plants: 2, min_streak_days: 0, time_of_day: day, chance: 0.5, favourite_fruit: hazelnut, thanks_coins: 8 }
  fox: { name: Fox, emoji: "🦊", environments: [forest, alpine], min_mature_plants: 3, min_streak_days: 7, time_of_day: any, chance: 0.25, favourite_fruit: blueberry, thanks_coins: 15 }
  rabbit: { name: Rabbit, emoji: "🐇", environments: [orchard, meadow], min_mature_plants: 2, min_streak_days: 2, time_of_day: day, chance: 0.4, favourite_fruit: pear, thanks_coins: 8 }
