# Each plot slowly moves through the seasons, starting from the day it was
# unlocked. One full year takes 4 x days_per_season.
seasons:
  days_per_season: 7

# Cosmetics: one item can be placed per kind in each plot.
# Kinds: path, fence, pond, bench, lantern, background.
cosmetics:
  stone_path: { name: Stepping stones, emoji: "🪨", kind: path, price: 40 }
  flower_path: { name: Petal path, emoji: "🌸", kind: path, price: 70 }
  picket_fence: { name: Picket fence, emoji: "🪵", kind: fence, price: 50 }
  hedge_fence: { name: Little hedge, emoji: "🌳", kind: fence, price: 80 }
  lily_pond: { name: Lily pond, emoji: "💧", kind: pond, price: 120 }
  wooden_bench: { name: Wooden bench, emoji: "🪑", kind: bench, price: 60 }
  paper_lantern: { name: Paper lanterns, emoji: "🏮", kind: lantern, price: 60 }
  fairy_lights: { name: Fairy lights, emoji: "✨", kind: lantern, price: 90 }
  sunset_sky: { name: Sunset sky, emoji: "🌇", kind: background, price: 100 }
  aurora_sky: { name: Aurora sky, emoji: "🌌", kind: background, price: 160 }

# Mystery seed packs. On purpose, these are a worse deal than doing quests.
mystery_packs:
  small_pack:
    name: Mystery seed
    emoji: "🎁"
    price: 60
    seeds: 1
    odds: { common: 0.85, uncommon: 0.13, rare: 0.02 }

# Recipes turn fruit into small bonuses.
# Ingredients use species ids (the fruit of that plant).
# Effects:
#   growth_boost  every plant in every plot jumps `hours` ahead in growth and fruit
#   coins         gives `amount` coins
#   visitor_lure  doubles visitor chances for `hours`
recipes:
  fruit_salad:
    name: Fruit salad
    emoji: "🥗"
    ingredients: { apple_tree: 2, berry_bush: 2 }
    effect: { type: coins, amount: 35 }
  calming_tea:
    name: Calming tea
    emoji: "🍵"
    ingredients: { lavender_hedge: 2 }
    effect: { type: visitor_lure, hours: 6 }
  sunny_granola:
    name: Sunny granola
    emoji: "🥣"
    ingredients: { giant_sunflower: 3, hazelnut: 2 }
    effect: { type: growth_boost, hours: 2 }
  forest_stew:
    name: Forest stew
    emoji: "🍲"
    ingredients: { mushroom_grove: 3, fern_canopy: 2 }
    effect: { type: growth_boost, hours: 3 }
  orchard_pie:
    name: Orchard pie
    emoji: "🥧"
    ingredients: { cherry: 2, pear: 2, peach: 2 }
    effect: { type: coins, amount: 90 }
  hot_cocoa:
    name: Hot cocoa
    emoji: "☕"
    ingredients: { cacao: 2, coconut_palm: 1 }
    effect: { type: growth_boost, hours: 6 }

# The free seed planted during onboarding.
starter_seed: giant_sunflower
