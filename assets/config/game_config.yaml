# ---------------------------------------------------------------------------
# Sprout game rules
#
# Every balance number in the game lives in this one file. Change a value,
# push to GitHub, and the next APK uses it. A test checks this file on every
# build, so a typo shows up as a failed build instead of a broken app.
#
# Times are in minutes unless the key says otherwise.
# Rarities: common, uncommon, rare.
# Quest categories: sleep, movement, mind, social, home, food_water, study_work.
# ---------------------------------------------------------------------------

quests:
  # How many counted quest completions fill the Seed Meter and earn one seed.
  quests_per_seed: 3
  # Completions beyond this many per day still count as done, but don't fill
  # the meter. 9 = up to 3 seeds a day.
  max_counted_completions_per_day: 9
  # How long the "Undo" button stays available after completing a quest.
  undo_seconds: 10
  # Points each difficulty adds when deciding a seed's rarity.
  difficulty_points:
    small: 1
    medium: 2
    big: 3

# Seed rarity comes from the total difficulty points of the 3 quests that
# filled the meter (3 smalls = 3 points, 3 bigs = 9 points). The tier with the
# highest min_points that the total reaches is used. Odds in a tier must add
# up to 1.0.
rarity_tiers:
  - min_points: 3 # mostly small
    odds: { common: 1.0 }
  - min_points: 5 # a mix
    odds: { common: 0.40, uncommon: 0.55, rare: 0.05 }
  - min_points: 7 # some big ones
    odds: { common: 0.10, uncommon: 0.55, rare: 0.35 }
  - min_points: 9 # all big
    odds: { uncommon: 0.40, rare: 0.60 }

# When picking which species of a family you get, species that can grow in a
# plot you've already unlocked are this many times more likely.
unlocked_environment_bias: 3.0

# Which plant family each quest category grows.
category_families:
  movement: sunflower
  mind: lavender
  sleep: moonflower
  food_water: berry
  social: rose
  home: herb
  study_work: bamboo

families:
  sunflower: { name: Sunflower family, emoji: "🌻" }
  lavender: { name: Lavender family, emoji: "🪻" }
  moonflower: { name: Moonflower family, emoji: "🌙" }
  berry: { name: Berry family, emoji: "🫐" }
  rose: { name: Rose family, emoji: "🌹" }
  herb: { name: Herb & vine family, emoji: "🌿" }
  bamboo: { name: Bamboo & focus family, emoji: "🎋" }

seed_bag:
  # Quest seeds always go into the bag. Mystery packs can't be bought while
  # the bag is at the cap.
  cap: 40
  # Coins for composting one spare seed.
  compost_coins: { common: 3, uncommon: 8, rare: 20 }

# Garden plots, in unlock order. Each plot has `slots` plant spaces.
# `price` is in coins. The first plot is free and unlocked from the start.
environments:
  meadow:
    name: Meadow
    emoji: "🌼"
    price: 0
    slots: 3
    description: Soft grass, wildflowers and a gentle breeze.
  forest:
    name: Forest
    emoji: "🌲"
    price: 150
    slots: 3
    description: Dappled shade, mossy logs and fireflies at dusk.
  orchard:
    name: Orchard
    emoji: "🧺"
    price: 350
    slots: 3
    description: Neat rows of fruit trees and a picnic blanket.
  wetland:
    name: Pond
    emoji: "🪷"
    price: 600
    slots: 3
    description: Still water, reeds and a chorus of frogs.
  desert:
    name: Desert
    emoji: "🏜️"
    price: 900
    slots: 3
    description: Warm sand, big skies and starry nights.
  tropical:
    name: Tropical
    emoji: "🌴"
    price: 1300
    slots: 3
    description: Lush leaves, warm rain and bright birds.
  alpine:
    name: Alpine
    emoji: "🏔️"
    price: 1800
    slots: 3
    description: Crisp air, snowy peaks and wildflower slopes.

