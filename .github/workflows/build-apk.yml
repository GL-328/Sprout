name: Build APK

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Generate code
        run: |
          if grep -q build_runner pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Set up release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SPROUT_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SPROUT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SPROUT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SPROUT_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets found. Building with a temporary debug key; this APK cannot update one signed with a different key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk sprout.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sprout-apk
          path: sprout.apk

      - name: Write version file for in-app updates
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          jq -n \
            --argjson code "${GITHUB_RUN_NUMBER}" \
            --arg name "$VERSION_NAME" \
            --arg sha "$(sha256sum sprout.apk | cut -d' ' -f1)" \
            --arg notes "$(git log -1 --format=%s)" \
            '{versionCode: $code, versionName: $name, sha256: $sha, notes: $notes}' > version.json
          cat version.json

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAG=latest
            TITLE="Sprout (latest)"
            EXTRA=""
          else
            TAG=dev-latest
            TITLE="Sprout (dev preview)"
            EXTRA="--prerelease"
          fi
          NOTES="Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7} (run #${GITHUB_RUN_NUMBER}). Download sprout.apk below."
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" || true
          gh release create "$TAG" sprout.apk version.json \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "$NOTES" \
            $EXTRA
