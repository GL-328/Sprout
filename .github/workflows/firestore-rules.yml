name: Firestore rules

on:
  push:
    paths:
      - firestore.rules
      - firestore-tests/**
      - .github/workflows/firestore-rules.yml
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firestore-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test the rules on the Firestore emulator
        run: npm test
